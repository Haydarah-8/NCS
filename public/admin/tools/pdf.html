<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>PDF editor · New Concept Security</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&amp;display=swap">
  <link rel="stylesheet" href="assets/css/studio.css">
  <link rel="stylesheet" href="assets/css/pdf.css">
</head>
<body>
  <header class="st-head">
    <div>
      <p class="st-eyebrow">Tools</p>
      <h1 class="st-title">PDF editor.</h1>
    </div>
    <div class="st-actions">
      <button class="st-btn" type="button" data-open>Open PDF</button>
      <button class="st-btn" type="button" data-add data-needs-doc>Add pages from a PDF</button>
      <button class="st-btn is-solid" type="button" data-save data-needs-doc>Download PDF</button>
    </div>
  </header>

  <nav class="pe-bar" aria-label="Tools">
    <button type="button" data-tool="select" aria-pressed="true" title="Select and move (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3l14 8-6 2-2 6z"/></svg>Select</button>
    <button type="button" data-tool="text" title="Add text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
    <button type="button" data-tool="highlight" title="Highlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h7M14 4l6 6-8 8H6v-6z"/></svg>Highlight</button>
    <button type="button" data-tool="rect" title="Box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Box</button>
    <button type="button" data-tool="line" title="Line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 19 5"/></svg>Line</button>
    <button type="button" data-tool="pen" title="Draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c4-1 5-6 8-8s5 1 8-3"/></svg>Draw</button>
    <button type="button" data-tool="whiteout" title="White-out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="7" width="16" height="10" rx="2" fill="#fff"/></svg>White-out</button>
    <span class="pe-sep"></span>
    <button type="button" data-tool="signature" title="Signature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3 0 4-9 6-9s0 9 3 9 3-5 5-5 1 5 4 5M3 21h18"/></svg>Sign</button>
    <button type="button" data-tool="stamp" title="Stamp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 3h6v5l3 4H6l3-4zM4 15h16v3H4zM6 21h12"/></svg>Stamp</button>
    <button type="button" data-tool="image" title="Picture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>Picture</button>
    <button type="button" data-tool="date" title="Today's date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Date</button>
    <button type="button" data-tool="check" title="Tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>Tick</button>
    <span class="pe-sep"></span>
    <button type="button" data-undo disabled title="Undo (Ctrl Z)">↶</button>
    <button type="button" data-redo disabled title="Redo (Ctrl Y)">↷</button>
    <span class="pe-sep"></span>
    <button type="button" data-zoom="out" title="Zoom out">−</button>
    <span class="pe-zoom" data-zoom-label>100%</span>
    <button type="button" data-zoom="in" title="Zoom in">+</button>
    <button type="button" data-zoom-fit title="Fit to width">Fit</button>
  </nav>

  <div class="pe-app">
    <aside class="pe-thumbs" data-thumbs aria-label="Pages"></aside>
    <main class="pe-viewer" data-viewer data-tool="select"></main>
    <aside class="pe-side">
      <section class="st-sec"><h2>Tool <small data-info></small></h2><div data-style></div></section>
      <section class="st-sec"><h2>Pages</h2>
        <div class="st-seg" style="gap:6px">
          <button type="button" data-blank>Add blank page</button>
          <button type="button" data-extract disabled>Save ticked pages as new PDF</button>
          <button type="button" data-delete-picked>Delete ticked pages</button>
        </div>
        <p class="pe-hint" style="margin-top:10px">Drag thumbnails to reorder. Drop more PDFs on the thumbnails to merge them in.</p>
      </section>
      <section class="st-sec"><h2>Form fields</h2><div data-fields></div></section>
      <section class="st-sec"><p class="pe-hint">Everything happens on this computer. The PDF is never uploaded.</p></section>
    </aside>
  </div>

  <dialog class="pe-dialog" data-sig-dialog>
    <h2>Your signature</h2>
    <canvas width="1000" height="320"></canvas>
    <label class="st-field">Or type it<input data-sig-type placeholder="Your name"></label>
    <div class="pe-dialog-actions">
      <button class="st-btn" type="button" data-sig-clear>Clear</button>
      <span style="display:flex;gap:8px"><button class="st-btn" type="button" onclick="this.closest('dialog').close()">Cancel</button><button class="st-btn is-solid" type="button" data-sig-use>Use signature</button></span>
    </div>
  </dialog>

  <input type="file" accept="application/pdf,.pdf" data-file hidden multiple>
  <input type="file" accept="application/pdf,.pdf" data-add-file hidden multiple>
  <input type="file" accept="image/*" data-img-file hidden>

  <script src="assets/js/exporter.js" defer></script>
  <script src="assets/js/pdfedit.js" defer></script>
</body>
</html>
