<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Email templates · New Concept Security</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/studio.css">
  <style>
    .em-group { margin: 12px 0 6px; color: var(--ink-3); font-size: 11.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    .em-group:first-of-type { margin-top: 0; }
    .em-inbox { width: min(100%, 680px); margin: 0 auto 14px; padding: 14px 18px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
    .em-inbox b { display: block; font-size: 15px; font-weight: 600; }
    .em-inbox span { display: block; overflow: hidden; color: var(--ink-2); font-size: 13.5px; text-overflow: ellipsis; white-space: nowrap; }
    .em-inbox small { color: var(--ink-3); font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase; }
    .em-frame { display: block; max-width: 100%; margin: 0 auto; border: 0; border-radius: 18px; background: #f5f5f7; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 30px 70px -34px rgba(0,0,0,.35); transition: width .25s; }
    .em-widths { display: flex; justify-content: center; margin-bottom: 14px; }
    .em-hint { color: var(--ink-2); font-size: 13px; }
    .em-guide { padding: 8px 0; border-top: 1px solid var(--line); }
    .em-guide:first-of-type { border-top: 0; }
    .em-guide summary { cursor: pointer; font-weight: 500; }
    .em-guide p { margin: 6px 0 2px; color: var(--ink-2); font-size: 13px; }
    .em-guide code { font: 12px var(--mono); }
  </style>
</head>
<body>
  <header class="st-head">
    <div>
      <p class="st-eyebrow">Marketing and clients</p>
      <h1 class="st-title">Email templates.</h1>
    </div>
    <div class="st-actions">
      <details class="st-menu">
        <summary class="st-btn">More</summary>
        <div class="st-menu-list">
          <button type="button" data-export="eml"><b>Draft email file (.eml)</b><span>Opens in Outlook or Mail, ready to send</span></button>
          <button type="button" data-export="mailto"><b>Open in my email app</b><span>Plain text, addressed and filled in</span></button>
          <button type="button" data-export="html"><b>Download HTML</b><span>For Mailchimp, Brevo or your email platform</span></button>
          <button type="button" data-export="text"><b>Copy plain text</b><span>For texts, WhatsApp or plain emails</span></button>
          <button type="button" data-export="reset"><b>Start again</b><span>Back to the quote follow-up</span></button>
        </div>
      </details>
      <button class="st-btn is-solid" type="button" data-export="copy">Copy into email</button>
    </div>
  </header>

  <div class="st-app">
    <div class="st-controls" data-controls></div>
    <div class="st-work">
      <div class="em-widths st-seg"><button type="button" data-width="640" aria-pressed="true">Desktop</button><button type="button" data-width="390">Phone</button></div>
      <div class="em-inbox"><small>Inbox preview</small><b data-subject></b><span data-pre></span></div>
      <iframe class="em-frame" data-frame title="Email preview" style="width:640px;height:900px"></iframe>
    </div>
  </div>

  <script src="assets/js/exporter.js" defer></script>
  <script src="assets/js/email.js" defer></script>
</body>
</html>
