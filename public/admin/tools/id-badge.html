<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ID badge · New Concept Security</title>
  <meta name="description" content="Officer ID badges with photo, SIA licence and expiry check.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="icon" href="assets/img/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Inter:wght@300..700&family=Manrope:wght@300..700&family=DM+Sans:wght@300..700&family=Montserrat:wght@300..700&family=Space+Grotesk:wght@300..700&family=Playfair+Display:wght@400..700&family=Fraunces:wght@300..700&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/docs.css">
  <link rel="stylesheet" href="assets/css/kit.css">
  <link rel="stylesheet" href="assets/css/embed.css">
</head>
<body class="doc-app" data-kit data-kit-type="badge">
  <main id="main" class="ds-container">
    <div class="dc-head">
      <div>
        <p class="dc-eyebrow">Brand and print</p>
        <h1 class="dc-title">ID badge.</h1>
      </div>
      <div class="dc-actions">
        <button class="ds-btn is-outline" type="button" data-export="print">Print 9 to a sheet</button>
        <button class="ds-btn is-outline" type="button" data-export="png">PNG</button>
        <button class="ds-btn is-solid" type="button" data-export="pdf">Download PDF</button>
      </div>
    </div>

    <div class="dc-layout">
      <form class="dc-editor" data-editor autocomplete="off" onsubmit="return false"></form>
      <div class="dc-preview">
        <div class="kit-stage"></div>
        <div class="dc-meta"><span data-meta></span><button class="dc-link" type="button" data-reset>Start again from the sample</button></div>
      </div>
    </div>
  </main>

  <div class="dc-print" aria-hidden="true"></div>
  <script src="assets/js/exporter.js" defer></script>
  <script src="assets/js/kit.js" defer></script>
  <script src="assets/js/studio.js" defer></script>
</body>
</html>
