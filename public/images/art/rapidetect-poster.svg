ill-box"><rect x="110" y="529" width="12" height="12" fill="#a01010" rx="2"/></g><text x="140" y="542" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start">60 metre radius coverage</text><g style="animation:glowpulse 2.5s ease-in-out -0.9s infinite;transform-origin:50% 50%;transform-box:fill-box"><rect x="110" y="573" width="12" height="12" fill="#a01010" rx="2"/></g><text x="140" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="500" fill="#1d1d1f" text-anchor="start">Monitored 24 hours</text><text x="110" y="717.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#86868b" text-anchor="start">Call today</text><text x="110" y="760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#a01010" text-anchor="start" letter-spacing="0.5">01253 982 211</text><rect x="940" y="820" width="580" height="2" fill="#b9b9bf"/><ellipse cx="1230" cy="820" rx="300" ry="84" fill="url(#r1)"/><ellipse cx="1230" cy="820" rx="150" ry="42" fill="none" stroke="#a01010" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.1"/><ellipse cx="1230" cy="820" rx="300" ry="84" fill="none" stroke="#a01010" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.2"/><g style="animation:ring 4.5s ease-out -0s infinite;transform-origin:50% 50%;transform-box:fill-box"><ellipse cx="1230" cy="820" rx="300" ry="84" fill="none" stroke="#a01010" stroke-width="3"/></g><g style="animation:ring 4.5s ease-out -1.5s infinite;transform-origin:50% 50%;transform-box:fill-box"><ellipse cx="1230" cy="820" rx="300" ry="84" fill="none" stroke="#a01010" stroke-width="3"/></g><g style="animation:ring 4.5s ease-out -3s infinite;transform-origin:50% 50%;transform-box:fill-box"><ellipse cx="1230" cy="820" rx="30