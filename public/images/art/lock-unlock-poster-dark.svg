<text x="110" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.5">Lock and unlock</text><text x="110" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-1.5">service.</text><text x="110" y="370" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#a1a1a6" text-anchor="start">Officers open and close your premises,</text><text x="110" y="404" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="500" fill="#a1a1a6" text-anchor="start">so the keys are never left with one person.</text><path d="M110 478L118 486L134 468" fill="none" stroke="#a01010" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" style="animation:draw40 4s ease-in-out -4s infinite;transform-origin:50% 50%;transform-box:fill-box"/><text x="152" y="486" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#f5f5f7" text-anchor="start">SIA-licensed officers</text><path d="M110 528L118 536L134 518" fill="none" stroke="#a01010" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" style="animation:draw40 4s ease-in-out -3.6s infinite;transform-origin:50% 50%;transform-box:fill-box"/><text x="152" y="536" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#f5f5f7" text-anchor="start">Signed, liveried vehicles</text><path d="M110 578L118 586L134 568" fill="none" stroke="#a01010" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="40" style="animation:draw40 4s ease-in-out -3.2s infinite;transform-origin:50% 50%;transform-box:fill-box"/><text x="152" y="586" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#f5f5f7" text-anchor="start">Alongside key holding</text><text x="110" y="717.5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#a1a1a6" text-anchor="start">Call today</text><text x="110" y="760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#a01010" text-anchor="start" letter-spacing="0.5">01253 982 211</text><g transform="translate(1180 440) scale(0.8600 0.8600)"><rect x="-128" y="-318" width="256" height="520" fill="#000" rx="34" opacity="0.2" transform="translate(10 14)"/><rect x="-128" y="-318" width="256" height="520" fill="url(#l1)" rx="34"/><rect x="-128" y="-318" width="256" height="520" fill="none" rx="34" stroke="#ffffff" stroke-width="2" opacity="0.6"/><circle cx="0" cy="-190" r="54" fill="#b8b8be"/><circle cx="0" cy="-190" r="44" fill="url(#l1)"/><g style="animation:press 6s ease-in-out -0s infinite;transform-origin:0px -190px;transform-box:view-box"><rect x="0" y="-214" width="270" height="46" fill="url(#l2)" rx="23"/><rect x="0" y="-214" width="270" height="46" fill="none" rx="23" stroke="#77777d" stroke-width="1.5"/><rect x="30" y="-206" width="220" height="6" fill="#fff" rx="3" opacity="0.6"/></g><circle cx="0" cy="-190" r="26" fill="#a5a5ab"/><circle cx="0" cy="0" r="44" fill="#a9a9af"/><circle cx="0" cy="0" r="36" fill="url(#l1)"/><circle cx="0" cy="-8" r="10" fill="#111114"/><polygon points="-6,-2 6,-2 9,24 -9,24" fill="#111114"/><path d="M4 -2L-8 -11H-118V11H-98L-94 19L-86 11H-76L-72 19L-64 11H-52L-48 17L-42 11H-8Z" fill="url(#l3)" stroke="#77777d" stroke-width="1.5" stroke-linejoin="round"/><line x1="-112" y1="-2" x2="-14" y2="-2" stroke="#8a8a90" stroke-width="2"/><rect x="-134" y="-17" width="18" heigh